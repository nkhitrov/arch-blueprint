# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: trailing-whitespace
        exclude: ^(tests/golden/|docs/images/)
      - id: check-toml
      - id: end-of-file-fixer
        # Both hold verbatim tool output; a "fix" makes them stop matching it.
        exclude: ^(tests/golden/|docs/images/)

  - repo: local
    hooks:
      - id: format
        name: Format with Ruff
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff
        name: Run ruff lints
        entry: uv run ruff
        language: system
        pass_filenames: false
        types: [python]
        args:
          - "check"
          - "--fix"
          - "src"
          - "tests"

      - id: mypy
        name: Validate types with MyPy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
        args:
          - ./src
          - ./tests

      - id: pytest
        name: Run tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        # Deliberately not restricted to python files: a commit touching only
        # tests/golden/** is exactly when the regression guard must run.
        always_run: true
        args:
          - "-q"
